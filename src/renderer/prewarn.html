<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Break soon</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }

  .card {
    height: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    border-radius: 14px;
    border: 1px solid rgba(199, 21, 98, 0.18);
    background: #fff6fa;
    box-shadow: 0 12px 40px rgba(61, 10, 34, 0.28);
    color: #3d0a22;
    animation: slide 320ms cubic-bezier(0.16, 0.9, 0.3, 1);
  }

  @keyframes slide {
    from { opacity: 0; transform: translateX(24px); }
    to { opacity: 1; transform: none; }
  }

  /* A tiny version of the app icon: pink screen, deep pink bezel, clock face. */
  .dot {
    flex: none;
    position: relative;
    width: 36px;
    height: 36px;
    border-radius: 9px;
    border: 3px solid #c71562;
    background: #ff5f9e;
  }

  .dot::after {
    content: "";
    position: absolute;
    inset: 7px;
    border-radius: 50%;
    background: #fff6fa;
  }

  .text { flex: 1; min-width: 0; line-height: 1.35; }

  .title { font-size: 14.5px; font-weight: 600; }

  .sub {
    font-size: 12px;
    color: rgba(61, 10, 34, 0.58);
    font-variant-numeric: tabular-nums;
  }

  button {
    flex: none;
    padding: 8px 13px;
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: #c71562;
    background: #ffffff;
    border: 1px solid rgba(199, 21, 98, 0.3);
    border-radius: 8px;
    cursor: pointer;
    transition: background 140ms, opacity 140ms;
  }

  button:hover { background: #ffe3ef; }

  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <div class="card">
    <div class="dot"></div>
    <div class="text">
      <div class="title">Time to look outside</div>
      <div class="sub" id="sub">Break starts shortly</div>
    </div>
    <button id="postpone" type="button">Postpone</button>
  </div>

<script>
  const sub = document.getElementById('sub');
  const postponeBtn = document.getElementById('postpone');
  let timerId = null;

  window.breaktimer.onPrewarn((data) => {
    let left = Math.max(0, Math.round(data.seconds));
    clearInterval(timerId);

    const paint = () => {
      sub.textContent = left > 0 ? `Starting in ${left}s` : 'Starting now';
    };
    paint();

    timerId = setInterval(() => {
      left -= 1;
      paint();
      if (left <= 0) clearInterval(timerId);
    }, 1000);

    if (data.postponeMinutes) postponeBtn.textContent = `Postpone ${data.postponeMinutes} min`;
    postponeBtn.disabled = false;
  });

  postponeBtn.addEventListener('click', () => {
    postponeBtn.disabled = true; // the toast is about to close; just guards against a double-click
    window.breaktimer.postpone();
  });
</script>
</body>
</html>
