<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Break soon</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }

  .card {
    height: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(18, 24, 33, 0.93);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    color: #eef3f9;
    animation: slide 320ms cubic-bezier(0.16, 0.9, 0.3, 1);
  }

  @keyframes slide {
    from { opacity: 0; transform: translateX(24px); }
    to { opacity: 1; transform: none; }
  }

  .dot {
    flex: none;
    width: 36px;
    height: 36px;
    border-radius: 9px;
    background: linear-gradient(150deg, #6fb3f0, #9ee7b8);
  }

  .text { flex: 1; min-width: 0; line-height: 1.35; }

  .title { font-size: 14.5px; font-weight: 600; }

  .sub {
    font-size: 12px;
    color: rgba(238, 243, 249, 0.6);
    font-variant-numeric: tabular-nums;
  }

  button {
    flex: none;
    padding: 8px 13px;
    font: inherit;
    font-size: 12.5px;
    font-weight: 500;
    color: #eef3f9;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 8px;
    cursor: pointer;
    transition: background 140ms, opacity 140ms;
  }

  button:hover { background: rgba(255, 255, 255, 0.16); }

  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <div class="card">
    <div class="dot"></div>
    <div class="text">
      <div class="title">Time to look outside</div>
      <div class="sub" id="sub">Break starts shortly</div>
    </div>
    <button id="postpone" type="button">Postpone</button>
  </div>

<script>
  const sub = document.getElementById('sub');
  const postponeBtn = document.getElementById('postpone');
  let timerId = null;

  window.breaktimer.onPrewarn((data) => {
    let left = Math.max(0, Math.round(data.seconds));
    clearInterval(timerId);

    const paint = () => {
      sub.textContent = left > 0 ? `Starting in ${left}s` : 'Starting now';
    };
    paint();

    timerId = setInterval(() => {
      left -= 1;
      paint();
      if (left <= 0) clearInterval(timerId);
    }, 1000);

    if (data.postponeMinutes) postponeBtn.textContent = `Postpone ${data.postponeMinutes} min`;
    postponeBtn.disabled = false;
  });

  postponeBtn.addEventListener('click', () => {
    postponeBtn.disabled = true; // the toast is about to close; just guards against a double-click
    window.breaktimer.postpone();
  });
</script>
</body>
</html>
