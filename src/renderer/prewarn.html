<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Break soon</title>
<style>
  /* The slice of the "Berry frame" palette this toast uses; the full set and
     its rules live in settings.html. */
  :root {
    --pink-50:  #fff3f6;
    --pink-500: #ff5f9e;
    --pink-700: #be2a6c;
    --pink-800: #951d53;
    --n-0:   #ffffff;
    --n-200: #ece4e6;
    --n-300: #d8ced1;
    --n-400: #b3a7aa;
    --n-600: #6c5f63;
    --n-900: #251d1f;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }

  .card {
    height: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    border-radius: 14px;
    border: 1px solid var(--n-200);
    background: var(--n-0);
    /* No drop shadow: the card fills the whole window, so a shadow is clipped
       at the window edge and only shows as grey wedges in the corners. */
    color: var(--n-900);
    animation: slide 320ms cubic-bezier(0.16, 0.9, 0.3, 1);
  }

  @keyframes slide {
    from { opacity: 0; transform: translateX(24px); }
    to { opacity: 1; transform: none; }
  }

  /* A tiny version of the app icon, framed like the Settings header:
     berry bezel around the brand-pink screen, white clock face. */
  .dot {
    flex: none;
    position: relative;
    width: 36px;
    height: 36px;
    border-radius: 9px;
    border: 3px solid var(--pink-700);
    background: var(--pink-500);
  }

  .dot::after {
    content: "";
    position: absolute;
    inset: 7px;
    border-radius: 50%;
    background: var(--n-0);
  }

  .text { flex: 1; min-width: 0; line-height: 1.35; }

  .title { font-size: 14.5px; font-weight: 600; }

  .sub {
    font-size: 12px;
    color: var(--n-600);
    font-variant-numeric: tabular-nums;
  }

  button {
    flex: none;
    padding: 8px 13px;
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--pink-800);
    background: var(--n-0);
    border: 1px solid var(--n-300);
    border-radius: 8px;
    cursor: pointer;
    transition: background 140ms, color 140ms;
  }

  button:hover { background: var(--pink-50); }

  button:disabled { color: var(--n-400); background: var(--n-0); cursor: default; }
</style>
</head>
<body>
  <div class="card">
    <div class="dot"></div>
    <div class="text">
      <div class="title">Time to look outside</div>
      <div class="sub" id="sub">Break starts shortly</div>
    </div>
    <button id="postpone" type="button">Postpone</button>
  </div>

<script>
  const sub = document.getElementById('sub');
  const postponeBtn = document.getElementById('postpone');
  let timerId = null;

  window.breaktimer.onPrewarn((data) => {
    let left = Math.max(0, Math.round(data.seconds));
    clearInterval(timerId);

    const paint = () => {
      sub.textContent = left > 0 ? `Starting in ${left}s` : 'Starting now';
    };
    paint();

    timerId = setInterval(() => {
      left -= 1;
      paint();
      if (left <= 0) clearInterval(timerId);
    }, 1000);

    if (data.postponeMinutes) postponeBtn.textContent = `Postpone ${data.postponeMinutes} min`;
    postponeBtn.disabled = false;
  });

  postponeBtn.addEventListener('click', () => {
    postponeBtn.disabled = true; // the toast is about to close; just guards against a double-click
    window.breaktimer.postpone();
  });
</script>
</body>
</html>
