<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Break soon</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }

  .card {
    height: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 20px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(18, 24, 33, 0.93);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    color: #eef3f9;
    animation: slide 320ms cubic-bezier(0.16, 0.9, 0.3, 1);
  }

  @keyframes slide {
    from { opacity: 0; transform: translateX(24px); }
    to { opacity: 1; transform: none; }
  }

  .dot {
    flex: none;
    width: 38px;
    height: 38px;
    border-radius: 9px;
    background: linear-gradient(150deg, #6fb3f0, #9ee7b8);
  }

  .text { line-height: 1.35; }

  .title { font-size: 15px; font-weight: 600; }

  .sub {
    font-size: 12.5px;
    color: rgba(238, 243, 249, 0.6);
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="dot"></div>
    <div class="text">
      <div class="title">Time to look outside</div>
      <div class="sub" id="sub">Break starts shortly</div>
    </div>
  </div>

<script>
  const sub = document.getElementById('sub');
  let timerId = null;

  window.breaktimer.onPrewarn((data) => {
    let left = Math.max(0, Math.round(data.seconds));
    clearInterval(timerId);

    const paint = () => {
      sub.textContent = left > 0 ? `Starting in ${left}s` : 'Starting now';
    };
    paint();

    timerId = setInterval(() => {
      left -= 1;
      paint();
      if (left <= 0) clearInterval(timerId);
    }, 1000);
  });
</script>
</body>
</html>
